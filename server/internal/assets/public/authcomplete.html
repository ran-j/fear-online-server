<!doctype html>
<html>
<head>

<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>{{.CallbackQuery}}</title>
</head>
<body>
<script>
window.name = "{{.CallbackQuery}}";
document.title = "{{.CallbackQuery}}";

  try { window.close(); } catch (error) {}
}, 750);
</script>

<input type="hidden" name="code" value="{{.Code}}">
</form>
<pre>{{.CallbackQuery}}</pre>
</body>
